<!doctype html><html lang="ceb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>BOARDWALK Collection Report</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f6;color:#111827;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 15px #0001;margin-bottom:16px}h1{text-align:center}.sub{text-align:center;color:#555}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:700}input,select,button{font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:9px;width:100%}button{background:#111827;color:#fff;font-weight:700;border:0}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{border:1px solid #111;padding:7px}th{background:#f3f4f6}td input,td select{border:0;border-radius:0;padding:5px}.total{font-weight:700}.print-title{display:none}@media(max-width:650px){.controls{grid-template-columns:1fr}}@media print{body{background:#fff}.no-print{display:none!important}.card{box-shadow:none;padding:0}.print-title{display:block}table{min-width:0;font-size:10px}td input,td select{border:0;padding:0;appearance:none}}
</style></head><body><div class="wrap">
<div class="card no-print"><h1>🖨️ BOARDWALK COLLECTION REPORT</h1><div class="sub">I-edit ang values, dayon Print / Save as PDF.</div>
<div class="controls"><label>Date<input id="date" type="date"></label><label>Report Title<input id="title" value="BOARDWALK - ALL STORES COLLECTION REPORT"></label></div>
<div class="actions"><button onclick="window.print()">🖨️ Print / Save PDF</button><button onclick="clearForm()">↺ Clear</button></div></div>
<div class="card"><div class="print-title"><h1 id="pTitle"></h1><div class="sub">Date: <span id="pDate"></span></div></div>
<div class="table-wrap"><table><thead><tr><th>#</th><th>Store</th><th>Expected</th><th>Actual</th><th>Balance</th><th>Status</th><th>Time</th><th>Collector</th></tr></thead><tbody id="rows"></tbody><tfoot><tr class="total"><td colspan="2">TOTAL</td><td id="te">0</td><td id="ta">0</td><td id="tb">0</td><td colspan="3">Paid: <span id="paid">0</span>/7</td></tr></tfoot></table></div>
<div style="display:flex;justify-content:space-around;margin-top:70px;text-align:center"><div style="width:35%;border-top:1px solid #111;padding-top:8px">Collector Signature</div><div style="width:35%;border-top:1px solid #111;padding-top:8px">Received By</div></div></div></div>
<script>
const rows=document.getElementById('rows');for(let i=1;i<=7;i++){let tr=document.createElement('tr');tr.innerHTML=`<td>${i}</td><td><input class="store" placeholder="Store ${i}"></td><td><input class="expected" type="number" placeholder="0"></td><td><input class="actual" type="number" placeholder="0"></td><td class="balance">0</td><td><select class="status"><option></option><option>PAID</option><option>UNPAID</option><option>PARTIAL</option></select></td><td><input type="time"></td><td><input placeholder="Name"></td>`;rows.appendChild(tr)}
function update(){let e=0,a=0,b=0,p=0;document.querySelectorAll('#rows tr').forEach(r=>{let x=+r.querySelector('.expected').value||0,y=+r.querySelector('.actual').value||0;r.querySelector('.balance').textContent=x-y;e+=x;a+=y;b+=x-y;if(r.querySelector('.status').value==='PAID')p++});te.textContent=e;ta.textContent=a;tb.textContent=b;paid.textContent=p;pTitle.textContent=title.value||'BOARDWALK - COLLECTION REPORT';pDate.textContent=date.value||''}
document.addEventListener('input',update);document.addEventListener('change',update);date.value=new Date().toISOString().slice(0,10);update();
function clearForm(){document.querySelectorAll('#rows input').forEach(x=>x.value='');document.querySelectorAll('#rows select').forEach(x=>x.value='');update()}
</script></body></html>
